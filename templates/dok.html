<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DOK</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dok.css') }}">
</head>
<body>
    <div class="dok-screen">
        <header class="dok-header">
            <button class="icon-btn sidebar-toggle" id="sidebar-toggle" aria-label="Conversas">☰</button>
            <a class="icon-btn" href="/" aria-label="Voltar">←</a>
            <span class="dok-title">{{ dok_name }}</span>
        </header>

        <div class="dok-body">
            <!-- Histórico de conversas — sempre visível na esquerda (desktop);
                 vira painel deslizante em telas pequenas -->
            <aside class="chat-sidebar" id="chat-sidebar">
                <button class="new-chat-btn" id="new-chat-btn">+ Nova conversa</button>
                <div class="chat-list" id="chat-list">
                    <p class="chat-list-empty" id="chat-list-empty" hidden>
                        Nenhuma conversa ainda.
                    </p>
                </div>
            </aside>
            <div class="sidebar-overlay" id="sidebar-overlay"></div>

            <!-- Conversa ativa — centralizada, ocupa o resto da tela -->
            <main class="chat-main">
                <div class="messages" id="messages">
                    <p class="empty-chat-msg" id="empty-chat-msg">
                        Toque em <strong>+ Nova conversa</strong> ou escreva
                        abaixo — o DOK pode conversar e também
                        <strong>checar de verdade</strong> (rede, sites,
                        dispositivos, domínios), ou processar pastas/arquivos
                        anexados com o botão +.
                    </p>
                </div>

                <div class="attach-menu" id="attach-menu" hidden>
                    <button type="button" class="attach-option" id="attach-folder-btn">📁 Pasta</button>
                    <button type="button" class="attach-option" id="attach-files-btn">📄 Arquivos</button>
                </div>

                <form class="composer" id="composer">
                    <button type="button" class="attach-btn" id="attach-toggle-btn" aria-label="Anexar">+</button>
                    <textarea
                        id="message-input"
                        class="message-input"
                        placeholder="Escreva pro DOK…"
                        rows="1"
                    ></textarea>
                    <button type="submit" class="send-btn" id="send-btn" aria-label="Enviar">➤</button>
                </form>
            </main>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/dok.js') }}"></script>
</body>
</html>
